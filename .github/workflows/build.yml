name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E '^e: |error:|What went wrong' -A4 build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kid-study-buddy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kid-study-buddy-apk
          path: kid-study-buddy.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest kid-study-buddy.apk \
            --target "$GITHUB_SHA" \
            --title "最新版 APK" \
            --notes "分支：${GITHUB_REF_NAME}　commit：${GITHUB_SHA::7}。用手機下載 kid-study-buddy.apk 安裝即可。"
